# Code Atlas: fully local. Only the LLM calls leave your machine (Anthropic API).
#
#   cp .env.example .env      # then set ANTHROPIC_API_KEY
#   docker compose up --build
#
# Open http://localhost:8090 for Temporalize (repository to running Temporal POC), or
# http://localhost:8090/atlas for Code Atlas: add a repository with "+ Add index" (or run
# ./scripts/index.sh /path/to/a/git/repo [name]). Compass Web, for browsing the stored
# indexes: http://localhost:8096. Temporal UI (indexing runs): http://localhost:8233.
# Indexing (`sync`) runs as a Temporal workflow on the `temporal` dev server below: the
# `index-worker` service runs the ones started from the UI; index.sh runs its own.

x-app-env: &app-env
  MONGO_URL: mongodb://mongo:27017
  SOURCE_DIR: /data/source
  TEMPORAL_ADDRESS: temporal:7233
  TEMPORAL_NAMESPACE: default
  # Browser-facing link to the Temporal UI (printed by sync, shown in the chat sidebar).
  TEMPORAL_UI_URL: http://localhost:${TEMPORAL_UI_PORT:-8233}
  # Compass Web, from inside the network (to look up its connection) and from the browser
  COMPASS_URL: http://compass:8080
  COMPASS_PUBLIC_URL: http://localhost:${COMPASS_PORT:-8096}
  # Chat token streaming (Redis Streams; not published to the host)
  REDIS_URL: redis://redis:6379/0
  # Indexing from the UI: repositories under REPOS_ROOT (default: your home directory) are
  # mounted read-only at the same path in the app and the worker, so host paths work as-is.
  REPOS_ROOT: ${REPOS_ROOT:-${HOME}}
  HOST_HOME: ${HOME}
  # Temporalize: clones (/data/tz/clones) and POC workspaces (/data/tz/workspaces), the tz-data volume
  TZ_DATA_DIR: /data/tz

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Temporal dev server (single process, SQLite file on a volume so workflow
  # history survives restarts). gRPC on 7233, UI on 8233.
  temporal:
    image: temporalio/temporal:1.9.1
    restart: unless-stopped
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/home/temporal/temporal.db"]
    ports:
      - "127.0.0.1:${TEMPORAL_PORT:-7233}:7233"
      - "127.0.0.1:${TEMPORAL_UI_PORT:-8233}:8233"
    volumes:
      # The image runs as `temporal` (uid 1000), which owns its home directory.
      - temporal-data:/home/temporal
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    image: code-atlas:local
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *app-env
    ports:
      - "127.0.0.1:${APP_PORT:-8090}:8080"
    volumes:
      # Read-write: deleting an index from the UI removes its mirrored source.
      - source-data:/data/source
      # Temporal Docs MCP sign-in (scripts/mcp_login.py), for docs search in chat and the
      # preflight before a sync. Read-write: the client saves a rotated refresh token.
      - ${CODE_ATLAS_CONFIG_DIR:-${HOME}/.config/code-atlas}:/run/code-atlas
      # The folder picker and the "is a sync needed?" check read repositories here.
      - ${REPOS_ROOT:-${HOME}}:${REPOS_ROOT:-${HOME}}:ro
      # Temporalize clones repositories here (read-write) and reads POC workspaces (diff, packet, push).
      - tz-data:/data/tz
    depends_on:
      mongo:
        condition: service_healthy
      temporal:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Runs chat turns: each conversation is a Temporal workflow (ChatSessionWorkflow), and
  # this worker runs the agent for every message. Same mounts as `app`, because the
  # agent's tools (source reads, Temporal Docs MCP search) run here.
  chat-worker:
    build: .
    image: code-atlas:local
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *app-env
    command: ["python", "-m", "chat.worker"]
    stop_grace_period: 45s
    volumes:
      - source-data:/data/source:ro
      - ${CODE_ATLAS_CONFIG_DIR:-${HOME}/.config/code-atlas}:/run/code-atlas
    depends_on:
      mongo:
        condition: service_healthy
      temporal:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Runs business-impact jobs ("Generate business impact" in the report view): each is a
  # BusinessImpactWorkflow (impact-<index>). Its own service, so long jobs never take chat's
  # slots. It reads only the stored report and the request in MongoDB: no source mount,
  # Redis or Docs MCP sign-in.
  impact-worker:
    build: .
    image: code-atlas:local
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *app-env
    command: ["python", "-m", "impact.worker"]
    stop_grace_period: 45s
    depends_on:
      mongo:
        condition: service_healthy
      temporal:
        condition: service_healthy

  # Token streams of chat turns in flight (ephemeral: no persistence, no host port).
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Runs the syncs started from the UI ("+ Add index", "Sync"): an embedded worker per
  # running sync, as index.sh does for its own; after a restart it resumes them.
  index-worker:
    build: .
    image: code-atlas:local
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *app-env
    entrypoint: ["semantic-ingress"]
    command: ["worker"]
    volumes:
      - source-data:/data/source
      - ${CODE_ATLAS_CONFIG_DIR:-${HOME}/.config/code-atlas}:/run/code-atlas
      - ${REPOS_ROOT:-${HOME}}:${REPOS_ROOT:-${HOME}}:ro
      # Repositories Temporalize cloned are indexed from here, at the same path as in the app.
      - tz-data:/data/tz:ro
    depends_on:
      mongo:
        condition: service_healthy
      temporal:
        condition: service_healthy

  # Runs Temporalize runs (TemporalizeWorkflow, tz-<run>): screens 5-7 of the UI at /.
  # It reads the repositories (clones, REPOS_ROOT) and the mirrored source, writes POC
  # workspaces to tz-data, and runs the generated POC in stub mode against the Temporal
  # target from the settings (by default the `temporal` dev server below).
  tz-worker:
    build: .
    image: code-atlas:local
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *app-env
    command: ["python", "-m", "temporalize.worker"]
    stop_grace_period: 45s
    volumes:
      - tz-data:/data/tz
      - source-data:/data/source:ro
      # Temporal Docs MCP sign-in (scripts/mcp_login.py): the design step and the coding agent search the
      # docs. Read-write: the client saves a rotated refresh token.
      - ${CODE_ATLAS_CONFIG_DIR:-${HOME}/.config/code-atlas}:/run/code-atlas
      - ${REPOS_ROOT:-${HOME}}:${REPOS_ROOT:-${HOME}}:ro
    depends_on:
      mongo:
        condition: service_healthy
      temporal:
        condition: service_healthy

  # Compass Web: MongoDB Compass in the browser, for looking at what an index stores
  # (summaries, lenses, reports). Community build of Compass's web UI, not an official
  # MongoDB image. The UI's "Open in Compass" button opens it at the chat's index.
  compass:
    image: haohanyang/compass-web:0.5.1
    restart: unless-stopped
    environment:
      CW_MONGO_URI: mongodb://mongo:27017/?name=Code%20Atlas
      CW_HOST: 0.0.0.0
      CW_PORT: "8080"
    ports:
      - "127.0.0.1:${COMPASS_PORT:-8096}:8080"
    depends_on:
      mongo:
        condition: service_healthy

  # Run on demand: docker compose run --rm -v /path/to/repo:/path/to/repo/:ro indexer \
  #   sync --repo-path /path/to/repo --repo-id <name>
  # (scripts/index.sh wraps this and mounts the folder for you)
  indexer:
    build: .
    image: code-atlas:local
    profiles: ["tools"]
    env_file: .env
    environment:
      <<: *app-env
    entrypoint: ["semantic-ingress"]
    volumes:
      - source-data:/data/source
    depends_on:
      mongo:
        condition: service_healthy
      temporal:
        condition: service_healthy

volumes:
  mongo-data:
  source-data:
  temporal-data:
  tz-data:

networks:
  default:
    name: code_atlas
